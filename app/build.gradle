plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'mingww64.phonestick'
    compileSdk 34

    defaultConfig {
        applicationId "mingww64.phonestick"
        minSdk 24
        targetSdk 34
        versionCode 26
        versionName "2.4.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'phonestickpass'
            keyAlias 'phonestick'
            keyPassword 'phonestickpass'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // pstrim 是可执行 elf，压缩后无法直接 chmod +x 运行
    androidResources {
        noCompress 'pstrim'
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.7.1'

    // Root Library (TopJohnWu LibSu v6.0.0 / commit 8c3e80ffe4)
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    // libsu 的二进制 IO（SuRandomAccessFile / SuFileInputStream）在独立模块里。
    // 镜像在 /data/media/0 下 app 读不到，浏览镜像内文件、解析文件系统都靠它。
    implementation 'com.github.topjohnwu.libsu:io:6.0.0'

    // 用户态文件系统解析器的单元测试（解析逻辑是纯 Kotlin，不需要真机）
    testImplementation 'junit:junit:4.13.2'
}

// 把镜像路径透传给单元测试：-Dps.test.image=fat32=/path/a.img
tasks.withType(Test).configureEach {
    systemProperty 'ps.test.image.fat32', System.getProperty('ps.test.image.fat32', '')
    systemProperty 'ps.test.image.exfat', System.getProperty('ps.test.image.exfat', '')
    systemProperty 'ps.test.image.ntfs', System.getProperty('ps.test.image.ntfs', '')
    systemProperty 'ps.test.image.ext4', System.getProperty('ps.test.image.ext4', '')
    systemProperty 'ps.test.image.ntfsnopt', System.getProperty('ps.test.image.ntfsnopt', '')
    systemProperty 'ps.test.image.gpt', System.getProperty('ps.test.image.gpt', '')
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}
